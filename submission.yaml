submission:
  title: "Threat Intelligence Correlation & Alert Prioritisation Assistant
"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Defence analysts receive thousands of alerts daily from:

• SIEM systems
• Satellite feeds
• Cyber sensors
• Intelligence reports

All arriving in different formats — faster than any human team can process.


  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    An AI pipeline built on IBM Bob that automates the entire threat analysis workflow:

  Ingest  →  Normalise  →  Correlate  →  Score  →  MITRE Map  →  BLUF Report

Operates continuously across SIEM, satellite, sensor, and intel report feeds — delivering prioritised, commander-ready summaries in minutes, not hours.


  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Speed

Alerts triaged in seconds, not hours. BLUF reports generated in under 2 minutes.
"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Accuracy

False positive rate reduced by ~80%. Genuine threats never buried in noise.
"
    - "Scalability

Handles thousands of alerts per minute. Scales with feed volume — no extra analysts needed.
"
    - ""                               # optional 4th
